    <!-- PWA meta tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <!-- Service Worker Isolation Shield: Clean up parent /foliox/ scope workers if on UAT -->
    <script type="text/javascript">
      (function() {
        if (typeof window !== 'undefined' && window.location.pathname.startsWith('/foliox/uat')) {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
              for (var i = 0; i < registrations.length; i++) {
                var scope = registrations[i].scope;
                if (scope.endsWith('/foliox/') || !scope.includes('/uat/')) {
                  registrations[i].unregister();
                }
              }
            });
          }
        }
      })();
    </script>

    <!-- Single Page Apps for GitHub Pages redirect recovery script -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          var basePath = l.pathname.replace(/\/+$/, '');
          window.history.replaceState(null, null,
              basePath + decoded + l.hash
          );
        }
      }(window.location))
    </script>
